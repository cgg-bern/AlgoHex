stages:
    - build

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: 10
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true" # rewrite git:// submodule urls to https
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 16

include:
- component: $CI_SERVER_FQDN/CGG-public/ci-components/cmake-cxx/debian@v0.6.0
  inputs:
    job_name: "debian-trixie-debug"
    stage: build
    CMAKE_BUILD_TYPE: Debug
    cmake_options: "-DALGOHEX_BUILD_EXPENSIVE_TESTS=Off"
    enable_asan: true
    enable_ctest: true
    #enable_coverage: true # this is rather slow for -- currently - no benefit
    image_variant: algohex

- component: $CI_SERVER_FQDN/CGG-public/ci-components/cmake-cxx/debian@v0.6.0
  inputs:
    job_name: "debian-trixie-release-asan"
    stage: build
    CMAKE_BUILD_TYPE: Release
    enable_asan: true
    enable_ctest: true
    image_variant: algohex

- component: $CI_SERVER_FQDN/CGG-public/ci-components/cmake-cxx/debian@v0.6.0
  inputs:
    job_name: "debian-trixie-release-shared"
    stage: build
    CMAKE_BUILD_TYPE: Release
    BUILD_SHARED_LIBS: ON
    enable_ctest: true
    image_variant: algohex

- component: $CI_SERVER_FQDN/CGG-public/ci-components/cmake-cxx/macos@v0.6.0
  inputs:
    job_name: "macos-golden-gate"
    stage: build
    macos_release: golden-gate
    CMAKE_BUILD_TYPE: RelWithDebInfo
    enable_ctest: true
    # before_script:
    #   - brew install gmp ipopt suite-sparse clp

